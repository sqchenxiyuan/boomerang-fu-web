<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>动作与特效展示</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./dev.css" />
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 290px 1fr 300px;
      }
      aside {
        overflow: auto;
        padding: 12px 14px 30px;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      aside.right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }
      aside h3 {
        margin: 16px 0 6px;
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 600;
      }
      aside h3:first-child {
        margin-top: 0;
      }
      .scenario {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 4px;
        border-color: transparent;
        background: transparent;
      }
      .scenario.active {
        background: var(--ink);
        color: var(--bg);
      }
      .stage-wrap {
        position: relative;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #stage {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #8fb7c6;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      .progress {
        height: 3px;
        background: var(--line);
      }
      .progress div {
        height: 100%;
        width: 0;
        background: var(--accent);
      }
      .info h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .info p {
        margin: 0 0 10px;
      }
      .info .godot {
        font-size: 12.5px;
        border-left: 3px solid var(--godot);
        padding-left: 8px;
        color: var(--muted);
      }
      .expect {
        margin: 8px 0 14px;
      }
      #log {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
      }
      #log div {
        display: flex;
        gap: 8px;
      }
      #log .t {
        color: var(--muted);
        min-width: 3.4em;
        text-align: right;
      }
      #log .hit {
        color: var(--godot);
        font-weight: 600;
      }
      .camera-readout {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 1000px) {
        body {
          height: auto;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        #stage {
          height: 56vh;
          flex: none;
        }
        aside {
          border: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>动作与特效展示</h1>
      <span class="muted">真实模拟 + 脚本输入驱动，画面与对局一致</span>
      <nav><a href="./sfx.html">音效对照 →</a><a href="/">返回游戏</a></nav>
    </header>
    <div class="layout">
      <aside id="scenarios"></aside>
      <div class="stage-wrap">
        <div id="stage"></div>
        <div class="progress"><div id="progress"></div></div>
        <div class="toolbar">
          <button id="replay" class="primary">↻ 重播</button>
          <button id="pause">暂停</button>
          <span class="chips" id="speeds"></span>
          <label class="inline"><input id="loop" type="checkbox" checked /> 循环</label>
          <label class="inline"><input id="auto" type="checkbox" /> 自动下一个</label>
          <label class="inline"><input id="pixel" type="checkbox" /> 像素风</label>
          <label class="inline"
            ><input id="follow" type="checkbox" checked /> 镜头跟随（Godot）</label
          >
          <label class="inline"><input id="sound" type="checkbox" /> Web 音效</label>
          <span id="camera" class="camera-readout"></span>
        </div>
      </div>
      <aside class="right">
        <div class="info" id="info"></div>
        <h3>事件记录</h3>
        <div id="log"></div>
      </aside>
    </div>
    <script type="module" src="./fx.ts"></script>
  </body>
</html>
